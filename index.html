<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LensForge — Kerr Black-Hole Renderer</title>
    <meta
      name="description"
      content="A physically rigorous real-time Kerr black-hole renderer in the browser: GPU-integrated null geodesics, exact relativistic radiometry, and a validated Novikov–Thorne accretion disk on WebGPU."
    />
    <meta name="theme-color" content="#04060a" />
    <style>
      html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
      #canvas { display: block; width: 100vw; height: 100vh; }

      /* Performance overlay — same position and layout as always; skin only. */
      #hud {
        position: fixed; top: 8px; left: 8px; padding: 8px 12px;
        font: 11.5px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: #a9b4bf; letter-spacing: 0.01em;
        background: rgba(9, 13, 19, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 10px;
        backdrop-filter: blur(14px) saturate(1.25);
        -webkit-backdrop-filter: blur(14px) saturate(1.25);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        white-space: pre; pointer-events: none; user-select: none;
      }
      #hud:empty { display: none; }

      #panel {
        position: fixed; top: 8px; right: 8px; width: 280px;
        max-height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden;
        background: rgba(10, 14, 20, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        backdrop-filter: blur(18px) saturate(1.3);
        -webkit-backdrop-filter: blur(18px) saturate(1.3);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        transition: opacity 200ms ease, transform 200ms ease, visibility 0s;
      }
      #panel:empty { display: none; }
      #panel::-webkit-scrollbar { width: 8px; }
      #panel::-webkit-scrollbar-track { background: transparent; }
      #panel::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14); border-radius: 4px;
        background-clip: padding-box; border: 2px solid transparent;
      }
      body.controls-hidden #panel {
        opacity: 0; transform: translateX(14px);
        pointer-events: none; visibility: hidden;
        transition: opacity 200ms ease, transform 200ms ease, visibility 0s 200ms;
      }

      /* Control-panel visibility toggle (H). Sits beside the panel; slides to
         the corner when the panel is hidden. Never overlaps the HUD. */
      #panel-toggle {
        position: fixed; top: 10px; right: 298px; z-index: 30;
        width: 30px; height: 30px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        color: #97a2ac; cursor: pointer;
        background: rgba(9, 13, 19, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9px;
        backdrop-filter: blur(14px) saturate(1.25);
        -webkit-backdrop-filter: blur(14px) saturate(1.25);
        transition: right 200ms ease, color 160ms ease,
          background-color 160ms ease, border-color 160ms ease;
      }
      #panel-toggle:hover {
        color: #e8eef4; background: rgba(20, 27, 36, 0.72);
        border-color: rgba(255, 255, 255, 0.16);
      }
      #panel-toggle:focus-visible { outline: 1px solid rgba(122, 184, 255, 0.6); outline-offset: 1px; }
      body.controls-hidden #panel-toggle { right: 12px; }

      #fallback {
        display: none; max-width: 46rem; margin: 18vh auto 0; padding: 0 2rem;
        font: 15px/1.7 system-ui, sans-serif; color: #c8ced4;
      }
      #fallback h1 { font-weight: 600; color: #fff; }
      #fallback a { color: #7ab8ff; }
      #fallback code { color: #e8b46a; }

      #attribution {
        position: fixed; bottom: 8px; left: 8px; padding: 3px 10px;
        font: 10px/1.5 system-ui, sans-serif; color: #6b747d;
        background: rgba(9, 13, 19, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 7px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: none; user-select: none;
      }
      #attribution:empty { display: none; }

      /* Startup loading overlay — inline so it renders before any module
         loads; dismissed by src/ui/loading.ts once assets are in. */
      #loading {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 50% 42%, #0a0f16 0%, #04060a 62%, #020306 100%);
        transition: opacity 600ms ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .loading-center { display: flex; flex-direction: column; align-items: center; }
      #loading .loading-mark {
        font: 300 24px/1 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 0.42em; text-indent: 0.42em; color: #e8eef4;
      }
      #loading .loading-tag {
        margin-top: 12px;
        font: 500 10px/1 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
        color: #5d6772;
      }
      #loading .loading-bar {
        margin-top: 36px; width: 280px; height: 2px;
        background: rgba(255, 255, 255, 0.08); border-radius: 1px; overflow: hidden;
      }
      #loading-fill {
        height: 100%; width: 5%;
        background: linear-gradient(90deg, #54759c, #8fb6e4);
        transition: width 450ms cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      #loading-stage {
        margin-top: 16px; min-height: 14px;
        font: 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: #7d8791; transition: opacity 150ms ease;
      }
      #loading-version {
        position: absolute; bottom: 18px;
        font: 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.08em; color: #3e4750;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="panel"></div>
    <button id="panel-toggle" type="button" aria-label="Hide control panel (H)" title="Hide control panel (H)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <line x1="2.2" y1="4.2" x2="13.8" y2="4.2" />
        <line x1="2.2" y1="8" x2="13.8" y2="8" />
        <line x1="2.2" y1="11.8" x2="13.8" y2="11.8" />
        <circle cx="6" cy="4.2" r="1.5" fill="#04060a" />
        <circle cx="10.5" cy="8" r="1.5" fill="#04060a" />
        <circle cx="4.5" cy="11.8" r="1.5" fill="#04060a" />
      </svg>
    </button>
    <div id="attribution"></div>
    <div id="fallback"></div>
    <div id="loading" role="status" aria-label="Loading LensForge">
      <div class="loading-center">
        <div class="loading-mark">LENSFORGE</div>
        <div class="loading-tag">Kerr black-hole renderer</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <div id="loading-stage">Initializing WebGPU</div>
      </div>
      <div id="loading-version"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
